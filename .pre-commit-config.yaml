repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: mixed-line-ending

  # Use local hooks so they match CI exactly via nix-provided tools
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format --check --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false
        args: ['src/']

      - id: bandit
        name: bandit
        entry: bandit -c pyproject.toml -r
        language: system
        pass_filenames: false
        args: ['src/']

      - id: codespell
        name: codespell
        entry: codespell --skip '*.po,*.pot,*.mo,*.lock'
        language: system
        types: [text]

      - id: pytest
        name: pytest
        entry: pytest --no-header -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: docs-build
        name: docs build
        entry: bash -c 'cd docs && mkdocs build --strict'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
