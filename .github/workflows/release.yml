name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # ── Python wheel + sdist ─────────────────────────────────
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Standalone binaries via PyInstaller ──────────────────
  build-binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: geotui-linux-amd64
            binary: dist/geotui
          - os: macos-latest
            artifact: geotui-macos-amd64
            binary: dist/geotui
          - os: macos-14
            artifact: geotui-macos-arm64
            binary: dist/geotui
          - os: windows-latest
            artifact: geotui-windows-amd64.exe
            binary: dist/geotui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller
      - name: Build standalone binary
        run: |
          pyinstaller --onefile \
            --name geotui \
            --add-data "src/geotui/styles:geotui/styles" \
            --add-data "src/geotui/i18n:geotui/i18n" \
            src/geotui/__main__.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # ── Debian .deb package ──────────────────────────────────
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geotui \
            --add-data "src/geotui/styles:geotui/styles" \
            --add-data "src/geotui/i18n:geotui/i18n" \
            src/geotui/__main__.py
      - name: Package as .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/local/bin
          cp dist/geotui pkg/usr/local/bin/geotui
          chmod 755 pkg/usr/local/bin/geotui
          cat > pkg/DEBIAN/control << EOF
          Package: geotui
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: Kartoza (Pty) Ltd <info@kartoza.com>
          Description: Midnight Commander-style TUI for GeoServer management
           A beautiful terminal user interface for managing GeoServer instances.
           Built with Python/Textual. Supports shapefile, GeoPackage, and
           GeoTIFF publishing with PDF reports.
          Homepage: https://github.com/kartoza/geotui
          EOF
          dpkg-deb --build pkg geotui_${VERSION}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: geotui-deb
          path: "*.deb"

  # ── RPM package ──────────────────────────────────────────
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          sudo apt-get update && sudo apt-get install -y rpm
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geotui \
            --add-data "src/geotui/styles:geotui/styles" \
            --add-data "src/geotui/i18n:geotui/i18n" \
            src/geotui/__main__.py
      - name: Package as .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpmbuild/BUILDROOT/geotui-${VERSION}-1.x86_64/usr/local/bin
          cp dist/geotui rpmbuild/BUILDROOT/geotui-${VERSION}-1.x86_64/usr/local/bin/
          chmod 755 rpmbuild/BUILDROOT/geotui-${VERSION}-1.x86_64/usr/local/bin/geotui
          cat > rpmbuild/SPECS/geotui.spec << EOF
          Name: geotui
          Version: ${VERSION}
          Release: 1
          Summary: Midnight Commander-style TUI for GeoServer management
          License: MIT
          URL: https://github.com/kartoza/geotui
          Group: Applications/Science

          %description
          A beautiful terminal user interface for managing GeoServer instances.

          %files
          /usr/local/bin/geotui
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/geotui.spec
      - uses: actions/upload-artifact@v4
        with:
          name: geotui-rpm
          path: rpmbuild/RPMS/**/*.rpm

  # ── AppImage ─────────────────────────────────────────────
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-extracted
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geotui \
            --add-data "src/geotui/styles:geotui/styles" \
            --add-data "src/geotui/i18n:geotui/i18n" \
            src/geotui/__main__.py
      - name: Package as AppImage
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p GeoTUI.AppDir/usr/bin
          cp dist/geotui GeoTUI.AppDir/usr/bin/
          chmod 755 GeoTUI.AppDir/usr/bin/geotui

          cat > GeoTUI.AppDir/AppRun << 'APPRUN'
          #!/usr/bin/env bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/geotui" "$@"
          APPRUN
          chmod +x GeoTUI.AppDir/AppRun

          cat > GeoTUI.AppDir/geotui.desktop << EOF
          [Desktop Entry]
          Name=GeoTUI
          Exec=geotui
          Icon=geotui
          Type=Application
          Categories=Science;Geography;
          Comment=Midnight Commander-style TUI for GeoServer
          Terminal=true
          EOF

          # Placeholder icon (1x1 PNG)
          convert -size 256x256 xc:transparent GeoTUI.AppDir/geotui.png 2>/dev/null || \
            touch GeoTUI.AppDir/geotui.png

          ARCH=x86_64 ./appimagetool-extracted/AppRun GeoTUI.AppDir \
            GeoTUI-${VERSION}-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: geotui-appimage
          path: "*.AppImage"

  # ── Flatpak package (disabled - needs flatpak-pip-generator for offline deps) ──
  # build-flatpak:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Install Flatpak tools
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y flatpak flatpak-builder
  #         flatpak remote-add --user --if-not-exists \
  #           flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  #         flatpak install --user -y \
  #           flathub org.freedesktop.Platform//24.08 \
  #           org.freedesktop.Sdk//24.08
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: Build Flatpak bundle
  #       run: |
  #         VERSION=${GITHUB_REF_NAME#v}
  #         flatpak-builder --user --install-deps-from=flathub \
  #           --force-clean build-dir flatpak/com.kartoza.GeoTUI.yml
  #         flatpak build-export repo build-dir
  #         flatpak build-bundle repo \
  #           GeoTUI-${VERSION}.flatpak com.kartoza.GeoTUI
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: geotui-flatpak
  #         path: "*.flatpak"

  # ── Snap package ─────────────────────────────────────────
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: geotui-snap
          path: ${{ steps.build.outputs.snap }}

  # ── SBOM for release ─────────────────────────────────────
  release-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment \
            -o geotui-sbom.json \
            --output-format JSON
      - uses: actions/upload-artifact@v4
        with:
          name: geotui-sbom
          path: geotui-sbom.json

  # ── Publish to PyPI (disabled until trusted publisher configured) ──
  # To enable: configure a trusted publisher at https://pypi.org/manage/project/geotui/settings/publishing/
  # publish-pypi:
  #   needs: build-python
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: python-dist
  #         path: dist/
  #     - name: Publish to PyPI
  #       uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release with all artifacts ────────────────────
  github-release:
    needs:
      - build-python
      - build-binary
      - build-deb
      - build-rpm
      - build-appimage
      - build-snap
      # - build-flatpak  # TODO: fix offline dep vendoring
      - release-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: List artifacts
        run: find artifacts/ -type f | sort
      - name: Generate release body
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat > release-body.md << 'EOF'
          ## GeoTUI — GeoServer Manager

          A beautiful Midnight Commander-style TUI for GeoServer management.
          Made with love by [Kartoza](https://kartoza.com).

          ### Installation

          #### Linux

          | Format | File | Install |
          |--------|------|---------|
          | **AppImage** | `GeoTUI-VERSION-x86_64.AppImage` | `chmod +x GeoTUI-*.AppImage && ./GeoTUI-*.AppImage` |
          | **Debian/Ubuntu** | `geotui_VERSION_amd64.deb` | `sudo dpkg -i geotui_*.deb` |
          | **Fedora/RHEL** | `geotui-VERSION-1.x86_64.rpm` | `sudo rpm -i geotui-*.rpm` |
          | **Snap** | `geotui_VERSION_amd64.snap` | `sudo snap install --dangerous geotui_*.snap` |
          | **Flatpak** | `GeoTUI-VERSION.flatpak` | `flatpak install GeoTUI-*.flatpak` |
          | **Standalone** | `geotui-linux-amd64` | `chmod +x geotui-linux-amd64 && sudo cp geotui-linux-amd64 /usr/local/bin/geotui` |

          #### macOS

          | Architecture | File |
          |-------------|------|
          | **Intel (x86_64)** | `geotui-macos-amd64` |
          | **Apple Silicon (M1/M2/M3)** | `geotui-macos-arm64` |

          ```bash
          chmod +x geotui-macos-*
          sudo cp geotui-macos-* /usr/local/bin/geotui
          ```

          > **Gatekeeper:** Run `xattr -d com.apple.quarantine /usr/local/bin/geotui` or allow in System Settings > Privacy & Security.

          #### Windows

          Download `geotui-windows-amd64.exe` and move to a directory in your PATH.

          > **SmartScreen:** Click "More info" → "Run anyway" on first launch.

          #### Python (pip)

          ```bash
          pip install geotui
          # or:
          pipx install geotui
          ```

          ### Other Downloads

          | File | Description |
          |------|-------------|
          | `geotui-VERSION.tar.gz` | Source distribution |
          | `geotui-VERSION-py3-none-any.whl` | Python wheel |
          | `geotui-sbom.json` | Software Bill of Materials (CycloneDX JSON) |

          > **Unsigned packages:** .deb, .rpm, and .snap are not signed with a distribution key. For .snap use `--dangerous`. For .rpm with GPG checking: `sudo rpm -i --nosignature geotui-*.rpm`.

          ---

          **[Documentation](https://kartoza.github.io/geotui)** | **[Source](https://github.com/kartoza/geotui)** | **[Sponsor](https://github.com/sponsors/kartoza)**

          Made with ❤️ by [Kartoza](https://kartoza.com)
          EOF
          # Replace VERSION placeholder
          sed -i "s/VERSION/${VERSION}/g" release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            artifacts/python-dist/*
            artifacts/geotui-linux-amd64/*
            artifacts/geotui-macos-amd64/*
            artifacts/geotui-macos-arm64/*
            artifacts/geotui-windows-amd64.exe/*
            artifacts/geotui-deb/*
            artifacts/geotui-rpm/**/*
            artifacts/geotui-appimage/*
            artifacts/geotui-snap/*
            artifacts/geotui-sbom/*
