services:
  geoserver:
    image: kartoza/geoserver:2.26.1
    container_name: geotui-test-geoserver
    ports:
      - "8600:8080"
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      STABLE_EXTENSIONS: ""
      COMMUNITY_EXTENSIONS: ""
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  geoserver-data:
